name: Firmware Build

on:
  push:
    paths:
      - 'fw/**'
  pull_request:
    paths:
      - 'fw/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-avr \
            binutils-avr \
            avr-libc

      - name: Build firmware
        working-directory: fw
        run: make

      - name: Report binary size
        run: |
          stat -c '%s bytes' fw/build/opensmi21.bin

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: opensmi21-firmware
          path: fw/build/opensmi21.bin
          if-no-files-found: error
          retention-days: 30
