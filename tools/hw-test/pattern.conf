#
# Geometry of the test pattern's frame counter, and the audio tones. Shared
# by make-pattern.sh, which draws them, and check-capture.py, which decodes
# them, so that the two can not drift apart. Plain KEY=VALUE: sourced by sh
# and parsed by python.

# The counter is a row of BITS squares, least significant bit leftmost, on a
# black strip. White is a set bit. Blocks are deliberately large: composite
# video is soft, and a block has to survive the SAA7113's filtering and stay
# legible in a single interlaced field.
BITS=8
BLOCK=56
GAP=24
ORIGIN_X=40
# Kept near the vertical middle, away from the overscan at the top and bottom
# of an analog frame, and clear of the vertical blanking interval.
ORIGIN_Y=200
MARGIN=16

# Distinct tones per channel, so that a swap of left and right is visible.
# Both divide 48000 exactly (48 and 32 samples per cycle), which keeps the
# expected phase of every analysis block identical and makes a dropped run of
# samples show up as a phase jump.
TONE_LEFT=1000
TONE_RIGHT=1500
SAMPLE_RATE=48000
